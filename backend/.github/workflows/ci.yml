name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    name: Lint, Test, Build, Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: skillsync
          POSTGRES_PASSWORD: skillsync
          POSTGRES_DB: skillsync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skillsync -d skillsync_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5

    env:
      NODE_ENV: test
      JWT_SECRET: ci-test-jwt-secret-at-least-32-characters
      DATABASE_URL: postgres://skillsync:skillsync@localhost:5432/skillsync_test
      REDIS_URL: redis://localhost:6379
      CORS_ORIGINS: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npx prettier --check "src/**/*.ts" "test/**/*.ts" || npx prettier --check "src/**/*.ts"

      - name: Unit tests with coverage
        run: npm run test:cov

      - name: E2E tests
        run: npm run test:e2e
        continue-on-error: false

      - name: Production build
        run: npm run build

      # Contract testing (#1484): regenerate the OpenAPI document and fail the
      # PR when it breaks compatibility with the base branch's copy.
      - name: OpenAPI breaking-change check
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          if git show "origin/${{ github.base_ref }}:backend/docs/openapi.json" > /tmp/openapi.base.json 2>/dev/null; then
            npm run openapi:generate -- /tmp/openapi.head.json
            npm run openapi:check -- /tmp/openapi.base.json /tmp/openapi.head.json
          else
            echo "No docs/openapi.json on the base branch yet; skipping."
          fi

      - name: Security audit
        run: npm audit --audit-level=high
