services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: skillsync
      POSTGRES_PASSWORD: skillsync_test
      POSTGRES_DB: skillsync_test
    ports:
      - '${DB_PORT_HOST:-5433}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U skillsync -d skillsync_test']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'no']
    ports:
      - '${REDIS_PORT_HOST:-6380}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
