name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, format, test, build & audit
    runs-on: ubuntu-latest
    timeout-minutes: 9

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: skillsync
          POSTGRES_PASSWORD: skillsync_test
          POSTGRES_DB: skillsync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skillsync -d skillsync_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      PORT: 3000
      JWT_SECRET: ci-only-jwt-secret-at-least-32-characters-long
      JWT_ACCESS_TTL_SECONDS: 900
      JWT_REFRESH_TTL_SECONDS: 604800
      DISABLE_SEED: 'true'
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: skillsync
      DB_PASSWORD: skillsync_test
      DB_NAME: skillsync_test
      DB_MIGRATIONS_RUN: 'true'
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      E2E_DATABASE_URL: postgres://skillsync:skillsync_test@localhost:5432/skillsync_test

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20 with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package.json

      # The repository intentionally does not commit a lockfile yet, so npm
      # resolves from package.json. The npm download cache still speeds this up.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint (fail on any ESLint error)
        run: npm run lint:check

      - name: Format check (Prettier)
        run: npm run format:check

      - name: Unit tests with coverage
        run: npm run test:cov -- --runInBand

      - name: E2E tests with dedicated database and Redis
        run: npm run test:e2e -- --runInBand

      - name: Production build check
        run: npm run build

      - name: Security audit (fail on high/critical advisories)
        run: npm audit --audit-level=high --no-fund
