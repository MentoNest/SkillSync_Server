name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ── NestJS backend ──────────────────────────────────────────────────────────
  backend:
    name: Backend — Lint, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npx eslint "{src,apps,libs,test}/**/*.ts" --max-warnings 20

      - name: Prettier format check
        run: npx prettier --check "src/**/*.ts" "test/**/*.ts"

      - name: Run unit tests
        run: npm run test -- --passWithNoTests --forceExit

      - name: Build (type-check / compile)
        run: npm run build

  # ── Soroban smart contract ───────────────────────────────────────────────────
  contract:
    name: Contract — Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: contract

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contract/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contract/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check (no warnings as errors)
        run: cargo check

      - name: Run tests
        run: cargo test
